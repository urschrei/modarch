[project]
name = "modarch"
version = "0.1.0"
description = "Format archaeology toolkit for Dolby MO print master disc images"
license = "BlueOak-1.0.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
modarch = "modarch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["modarch"]
