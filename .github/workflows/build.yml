name: build

on:
  push:
  pull_request:

jobs:
  imager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW-w64 (i686)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build imager.exe
        run: make -C imager
      - name: Verify msvcrt linkage (no UCRT)
        run: make -C imager check-vista
      - uses: actions/upload-artifact@v7          # ← moved BEFORE wine
        with:
          name: imager-vista-i686
          path: imager/imager.exe
      - name: Smoke test under Wine (Vista mode)
        continue-on-error: true
        timeout-minutes: 8                        # ← frozen mirror can't eat the runner
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y wine32:i386
          WINEDEBUG=-all wine imager/imager.exe || test $? -eq 2

  analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: analysis
          enable-cache: true
          cache-dependency-glob: analysis/uv.lock
      - run: uv sync --locked --extra dev
        working-directory: analysis
      - run: uv run pytest tests -q
        working-directory: analysis

  release:
    needs: [imager, analysis]          # both jobs green, incl. all matrix legs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write                  # needed to create the release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: imager-vista-i686
      - name: Rename and checksum
        run: |
          mv imager.exe imager-vista-i686.exe
          sha256sum imager-vista-i686.exe > imager-vista-i686.exe.sha256
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            imager-vista-i686.exe
            imager-vista-i686.exe.sha256
          generate_release_notes: true
