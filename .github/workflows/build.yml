name: build

on:
  push:
  pull_request:

jobs:
  imager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 (i686)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build imager.exe
        run: make -C imager
      - name: Smoke test under Wine (Vista mode)
        # best-effort: verifies the PE loads and prints usage; real
        # validation happens on the actual Vista machine
        continue-on-error: true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y wine32:i386
          WINEDEBUG=-all wine imager/imager.exe || test $? -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: imager-vista-i686
          path: imager/imager.exe

  analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "analysis/[dev]"
      - run: pytest analysis/tests -q
